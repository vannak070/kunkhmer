services:
  postgres:
    image: postgres:15-alpine
    container_name: kunkhmer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kunkhmer
      POSTGRES_PASSWORD: kunkhmer123
      POSTGRES_DB: kunkhmer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kunkhmer -d kunkhmer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Node.js API (Fastify + Prisma). Prepares the database (migrations, seed) on start.
  backend:
    build:
      context: ./backend
      target: dev
    container_name: kunkhmer_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://kunkhmer:kunkhmer123@postgres:5432/kunkhmer_db
    depends_on:
      postgres:
        condition: service_healthy

  # API instance for api-tests/ — database rebuilt from the migrations on every start.
  # Start with: docker compose --profile test up -d backend-test
  backend-test:
    build:
      context: ./backend
      target: dev
    container_name: kunkhmer_backend_test
    profiles: ["test"]
    ports:
      - "3002:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://kunkhmer:kunkhmer123@postgres:5432/kunkhmer_test
      RESET_DATABASE: "true"
      LOG_LEVEL: warn
    depends_on:
      postgres:
        condition: service_healthy

  frontend-admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: kunkhmer_frontend_admin
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5175:5175"
    volumes:
      - ./frontend/admin:/app
      - frontend_admin_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:3001
      VITE_API_BASE_URL: /api
    depends_on:
      - backend

  frontend-public:
    build:
      context: ./frontend/public
      dockerfile: Dockerfile
    container_name: kunkhmer_frontend_public
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5176:5176"
    volumes:
      - ./frontend/public:/app
      - frontend_public_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:3001
      VITE_API_BASE_URL: /api
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_admin_node_modules:
  frontend_public_node_modules:
  backend_node_modules:
