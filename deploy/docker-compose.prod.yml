# Kun Khmer — production on one server (see deploy/README.md).
#
#   cd deploy && cp .env.example .env   # fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only the web server (Caddy) is reachable from the internet; it serves the fan site, the admin
# and forwards /api to the backend, with automatic HTTPS certificates.
name: kunkhmer-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kunkhmer_db
      POSTGRES_USER: kunkhmer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kunkhmer -d kunkhmer_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kunkhmer:${POSTGRES_PASSWORD}@postgres:5432/kunkhmer_db
      PUBLIC_SITE_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN in deploy/.env}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_RATE_SALT: ${AI_RATE_SALT:?set AI_RATE_SALT in deploy/.env}
      # Password of the first Super Admin "admin", used only when the database is still empty (first start).
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in deploy/.env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_MONTHLY_CAP_USD: ${AI_MONTHLY_CAP_USD:-50}
      # KKF approval steps (off: KKF staff run the whole Program flow; see claude/updates/officer-run-program.md).
      APPROVALS_ENABLED: ${APPROVALS_ENABLED:-false}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        SITE_DOMAIN: ${SITE_DOMAIN}
        SITE_INDEXING: ${SITE_INDEXING:-false}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # Daily database dump + pictures archive, kept for BACKUP_KEEP_DAYS (see deploy/README.md to restore).
  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Off-site, encrypted copies of deploy/backups/ (claude/updates/offsite-backups.md). Starts only with
  # COMPOSE_PROFILES=offsite in deploy/.env; storage keys and the backup password come from deploy/.env.
  offsite:
    image: rclone/rclone:1.68.2
    profiles: ["offsite"]
    restart: unless-stopped
    environment:
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
      # The storage bucket (S3-compatible: Cloudflare R2, Backblaze B2, DigitalOcean Spaces…)
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: ${OFFSITE_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_STORE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_STORE_REGION: ${OFFSITE_REGION:-auto}
      RCLONE_CONFIG_STORE_NO_CHECK_BUCKET: "true"
      # Encryption on top of it: only someone with the backup password can open the copies.
      RCLONE_CONFIG_VAULT_TYPE: crypt
      RCLONE_CONFIG_VAULT_REMOTE: store:${OFFSITE_BUCKET:-kkf-backups}/kunkhmer
      RCLONE_CONFIG_VAULT_PASSWORD: ${OFFSITE_PASSWORD_OBSCURED:-}
      RCLONE_CONFIG_VAULT_FILENAME_ENCRYPTION: "off"
      RCLONE_CONFIG_VAULT_DIRECTORY_NAME_ENCRYPTION: "false"
    volumes:
      - ./backups:/backups
      - ./offsite.sh:/offsite.sh:ro
    entrypoint: ["/bin/sh", "/offsite.sh"]

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
